; ============================================================
; DTW 自动选波 —— 检测软件伴随守护配置
; 修改后执行 run_guard.bat stop，再执行 run_guard.bat 生效
; ============================================================
[guard]
; 检测软件进程名，多个用逗号分隔；.exe 后缀可写可不写
; 不确定时：先打开检测软件，再双击 run_guard.bat list 查看候选进程名
app_process = hello软件操作版

; 窗口标题关键字（进程名对不上时的兜底匹配）；留空则只按进程名判断
app_title = hello软件操作版

; 检查间隔（秒），越大越省资源，默认 3 秒足够
poll_interval = 3

; 连续命中几次才算"软件已打开"（默认 2 次，约 6 秒），避免一闪而过就拉起 watcher
start_consecutive = 2

; 软件关闭后等待多少秒再停止监测，避免软件自动重启导致反复启停
stop_delay = 5

; 登录后延迟多少秒才开始检测，避开开机阶段的磁盘高峰
startup_delay = 20

; 启动 watcher 后，等待其进程出现的最长秒数
start_timeout = 25

; 通知 watcher 退出后等待的最长秒数，超时才强制结束
stop_timeout = 8

; 启动失败后锁定多少秒再重试，避免反复失败刷日志
retry_cooldown = 120

; 监听目录（与 watcher 默认值保持一致）
watch_dir = d:/data test

; 启动命令（相对本目录，也可写绝对路径）
start_command = run.bat

; watcher 的 pid 文件与停止信号文件（相对本目录）
pid_file = watcher.pid
stop_flag = watcher.stop

; 对外状态文件，供人工排查
status_file = d:/data/watcher_status.txt
